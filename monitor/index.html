<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NTP Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:        #0a0e14;
  --bg2:       #0f141c;
  --bg3:       #151c27;
  --border:    #1e2a3a;
  --border2:   #243347;
  --text:      #c8d8e8;
  --text2:     #7a9ab8;
  --text3:     #4a6a88;
  --accent:    #00d4ff;
  --accent2:   #0099cc;
  --green:     #39d98a;
  --green2:    #1a7a4a;
  --yellow:    #f5c842;
  --yellow2:   #7a6010;
  --red:       #ff4d6a;
  --red2:      #7a1a28;
  --purple:    #b57aff;
  --mono:      'JetBrains Mono', monospace;
  --sans:      'Space Grotesk', sans-serif;
  --r:         6px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { font-size: 16px; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  min-height: 100vh;
  overflow-x: hidden;
}

/* Grid noise texture */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(0,212,255,0.015) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,212,255,0.015) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
  z-index: 0;
}

/* ─── Layout ─────────────────────────────────────────────── */

.wrap {
  position: relative;
  z-index: 1;
  max-width: 1800px;
  margin: 0 auto;
  padding: 24px 20px;
}

/* ─── Header ─────────────────────────────────────────────── */

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 28px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
  gap: 12px;
}

.header-left { display: flex; align-items: center; gap: 16px; }

.logo {
  font-family: var(--mono);
  font-size: 1.5rem;
  font-weight: 700;
  color: var(--accent);
  letter-spacing: -0.5px;
}

.logo span { color: var(--text3); font-weight: 300; }

.hostname {
  font-family: var(--mono);
  font-size: 0.8rem;
  color: var(--text3);
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 3px 8px;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}

.update-info {
  font-family: var(--mono);
  font-size: 0.75rem;
  color: var(--text3);
}

.update-info span { color: var(--accent); }

.btn-refresh {
  font-family: var(--mono);
  font-size: 0.75rem;
  color: var(--accent);
  background: transparent;
  border: 1px solid var(--accent2);
  border-radius: 4px;
  padding: 5px 12px;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
}
.btn-refresh:hover { background: var(--accent2); color: #fff; }

.status-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  display: inline-block;
  margin-right: 5px;
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%,100% { opacity: 1; }
  50%      { opacity: 0.4; }
}
.dot-good   { background: var(--green); }
.dot-warn   { background: var(--yellow); animation: none; }
.dot-error  { background: var(--red); animation: none; }
.dot-off    { background: var(--text3); animation: none; }

/* ─── Service pills ──────────────────────────────────────── */

.services { display: flex; gap: 8px; flex-wrap: wrap; }

.svc-pill {
  font-family: var(--mono);
  font-size: 0.7rem;
  padding: 3px 10px;
  border-radius: 20px;
  border: 1px solid;
  display: flex; align-items: center; gap: 5px;
  white-space: nowrap;
}
.svc-pill.on  { border-color: var(--green2); color: var(--green); background: rgba(57,217,138,0.06); }
.svc-pill.off { border-color: var(--red2);   color: var(--red);   background: rgba(255,77,106,0.06); }

/* ─── Stratum badge ──────────────────────────────────────── */

.stratum-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: var(--mono);
  background: linear-gradient(135deg, rgba(0,212,255,0.1), rgba(0,153,204,0.05));
  border: 1px solid rgba(0,212,255,0.25);
  border-radius: 8px;
  padding: 6px 14px;
  font-size: 0.8rem;
  color: var(--text2);
}
.stratum-badge .val { font-size: 1.4rem; font-weight: 700; color: var(--accent); line-height: 1; }
.stratum-badge .ref { font-size: 0.7rem; color: var(--text3); }

/* ─── Metric cards grid ──────────────────────────────────── */

.cards-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 12px;
  margin-bottom: 20px;
}

.metric-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 14px 16px;
  position: relative;
  overflow: hidden;
  transition: border-color 0.2s;
}
.metric-card:hover { border-color: var(--border2); }

.metric-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: var(--accent2);
  opacity: 0.4;
}
.metric-card.good::before  { background: var(--green); opacity: 0.6; }
.metric-card.warn::before  { background: var(--yellow); opacity: 0.6; }
.metric-card.error::before { background: var(--red); opacity: 0.6; }

.metric-label {
  font-size: 0.68rem;
  font-weight: 500;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 6px;
}

.metric-value {
  font-family: var(--mono);
  font-size: 1.5rem;
  font-weight: 700;
  color: var(--text);
  line-height: 1;
}
.metric-value .unit {
  font-size: 0.75rem;
  font-weight: 400;
  color: var(--text3);
  margin-left: 3px;
}

.metric-sub {
  font-family: var(--mono);
  font-size: 0.68rem;
  color: var(--text3);
  margin-top: 4px;
}

/* ─── Section blocks ──────────────────────────────────────── */

.grid-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 16px;
}
.grid-3 {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 16px;
  margin-bottom: 16px;
}
@media (max-width: 900px) {
  .grid-2, .grid-3 { grid-template-columns: 1fr; }
}

.block {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--r);
  overflow: hidden;
}

.block-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 11px 16px;
  background: var(--bg3);
  border-bottom: 1px solid var(--border);
  gap: 8px;
}

.block-title {
  font-size: 0.72rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text2);
  display: flex; align-items: center; gap: 7px;
}

.block-badge {
  font-family: var(--mono);
  font-size: 0.65rem;
  padding: 2px 7px;
  border-radius: 3px;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text3);
}
.block-badge.good  { border-color: var(--green2); color: var(--green); }
.block-badge.warn  { border-color: var(--yellow2); color: var(--yellow); }
.block-badge.error { border-color: var(--red2); color: var(--red); }

.block-body { padding: 14px 16px; }

/* ─── Sources table ───────────────────────────────────────── */

.sources-table { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 0.72rem; }
.sources-table th {
  color: var(--text3);
  font-weight: 500;
  text-align: left;
  padding: 4px 8px 8px;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
.sources-table td {
  padding: 6px 8px;
  border-bottom: 1px solid var(--border);
  color: var(--text2);
  vertical-align: middle;
}
.sources-table tr:last-child td { border-bottom: none; }
.sources-table tr:hover td { background: rgba(255,255,255,0.02); }

.src-state {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 20px; height: 20px;
  border-radius: 4px;
  font-weight: 700;
  font-size: 0.8rem;
}
.src-selected { background: rgba(57,217,138,0.15); color: var(--green); border: 1px solid var(--green2); }
.src-combined { background: rgba(0,212,255,0.1);   color: var(--accent); border: 1px solid var(--accent2); }
.src-error    { background: rgba(255,77,106,0.1);  color: var(--red);   border: 1px solid var(--red2); }
.src-noselect { background: rgba(74,106,136,0.1);  color: var(--text3); border: 1px solid var(--border); }
.src-other    { background: transparent;            color: var(--text3); border: 1px solid var(--border); }

.reach-bar {
  display: inline-flex;
  gap: 2px;
  align-items: center;
}
.reach-bit {
  width: 5px; height: 10px;
  border-radius: 1px;
  background: var(--border2);
}
.reach-bit.on { background: var(--green); }

/* ─── GPS section ────────────────────────────────────────── */

.sat-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-top: 8px;
}

.sat-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--border2);
  position: relative;
}
.sat-dot.used { background: var(--green); }
.sat-dot.visible { background: var(--accent2); }
.sat-dot:hover::after {
  content: attr(title);
  position: absolute;
  bottom: 14px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--bg3);
  border: 1px solid var(--border2);
  color: var(--text);
  font-size: 0.65rem;
  font-family: var(--mono);
  white-space: nowrap;
  padding: 3px 6px;
  border-radius: 3px;
  pointer-events: none;
  z-index: 10;
}

.coord-row {
  display: flex;
  justify-content: space-between;
  font-family: var(--mono);
  font-size: 0.72rem;
  color: var(--text2);
  padding: 3px 0;
  border-bottom: 1px solid var(--border);
}
.coord-row:last-child { border-bottom: none; }
.coord-label { color: var(--text3); }

/* ─── Clients table ──────────────────────────────────────── */

.clients-table { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 0.72rem; }
.clients-table th { color: var(--text3); font-weight: 500; text-align: left; padding: 4px 8px 8px; border-bottom: 1px solid var(--border); }
.clients-table td { padding: 6px 8px; border-bottom: 1px solid var(--border); color: var(--text2); }
.clients-table tr:last-child td { border-bottom: none; }
.clients-table tr:hover td { background: rgba(255,255,255,0.02); }

/* ─── KV list ────────────────────────────────────────────── */

.kv-list { display: flex; flex-direction: column; gap: 0; }
.kv-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 6px 0;
  border-bottom: 1px solid var(--border);
  gap: 12px;
}
.kv-row:last-child { border-bottom: none; }
.kv-key {
  font-size: 0.72rem;
  color: var(--text3);
  white-space: nowrap;
  flex-shrink: 0;
}
.kv-val {
  font-family: var(--mono);
  font-size: 0.75rem;
  color: var(--text);
  text-align: right;
  word-break: break-all;
}
.kv-val.good  { color: var(--green); }
.kv-val.warn  { color: var(--yellow); }
.kv-val.error { color: var(--red); }
.kv-val.accent{ color: var(--accent); }

/* ─── Progress bar ───────────────────────────────────────── */

.progress-wrap { background: var(--bg3); border-radius: 3px; height: 4px; overflow: hidden; margin-top: 6px; }
.progress-bar  { height: 100%; border-radius: 3px; background: var(--accent); transition: width 0.5s; }
.progress-bar.warm { background: var(--yellow); }
.progress-bar.hot  { background: var(--red); }

/* ─── Skyview ────────────────────────────────────────────── */

#skyview-svg { display: block; max-width: 100%; }

.sky-legend {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  justify-content: center;
  margin-top: 10px;
  font-family: var(--mono);
  font-size: 0.65rem;
  color: var(--text3);
}
.sky-legend-item {
  display: flex;
  align-items: center;
  gap: 4px;
}
.sky-legend-shape {
  width: 14px;
  height: 14px;
  flex-shrink: 0;
}

@media (max-width: 900px) {
  #top-grid { grid-template-columns: 1fr !important; }
}

/* ─── Offset indicator ───────────────────────────────────── */

.offset-display {
  text-align: center;
  padding: 16px 0;
}
.offset-num {
  font-family: var(--mono);
  font-size: 2.4rem;
  font-weight: 700;
  line-height: 1;
}
.offset-unit {
  font-family: var(--mono);
  font-size: 0.85rem;
  color: var(--text3);
  margin-top: 4px;
}
.offset-good  { color: var(--green); }
.offset-warn  { color: var(--yellow); }
.offset-error { color: var(--red); }

/* ─── Error state ────────────────────────────────────────── */

.err-msg {
  font-family: var(--mono);
  font-size: 0.72rem;
  color: var(--red);
  padding: 8px 0;
  text-align: center;
}

/* ─── Loader ─────────────────────────────────────────────── */

#loader {
  position: fixed; inset: 0;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 100;
  transition: opacity 0.4s;
}
.loader-logo {
  font-family: var(--mono);
  font-size: 1.8rem;
  font-weight: 700;
  color: var(--accent);
  margin-bottom: 24px;
}
.loader-bar-wrap { width: 200px; height: 2px; background: var(--border); border-radius: 1px; overflow: hidden; }
.loader-bar      { height: 100%; background: var(--accent); width: 0; animation: load 1.2s ease forwards; }
@keyframes load { to { width: 100%; } }
.loader-text { font-family: var(--mono); font-size: 0.7rem; color: var(--text3); margin-top: 12px; }

/* ─── Scroll fix ─────────────────────────────────────────── */
.block-body.scroll { max-height: 320px; overflow-y: auto; }
.block-body.scroll::-webkit-scrollbar { width: 4px; }
.block-body.scroll::-webkit-scrollbar-track { background: var(--bg2); }
.block-body.scroll::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }
</style>
</head>
<body>

<div id="loader">
  <div class="loader-logo">NTP//MON</div>
  <div class="loader-bar-wrap"><div class="loader-bar"></div></div>
  <div class="loader-text">Загрузка данных...</div>
</div>

<div class="wrap" id="app" style="opacity:0;transition:opacity 0.4s">

  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <div class="logo">NTP<span>//</span>MON</div>
      <div class="hostname" id="h-hostname">—</div>
    </div>
    <div class="header-right">
      <div class="services" id="h-services"></div>
      <div class="update-info">Обновлено: <span id="h-time">—</span></div>
      <button class="btn-refresh" onclick="refresh()">↻ Обновить</button>
    </div>
  </div>

  <!-- Top metrics row -->
  <div class="cards-row" id="cards-row"></div>

  <!-- Sources + GPS info + Skyview -->
  <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:16px" id="top-grid">
    <div class="block" id="block-sources">
      <div class="block-head">
        <div class="block-title"><span class="status-dot dot-off" id="sd-sources"></span> Источники времени</div>
        <span class="block-badge" id="bb-sources">—</span>
      </div>
      <div class="block-body scroll" id="body-sources"><div class="err-msg">Загрузка...</div></div>
    </div>
    <div class="block" id="block-gps">
      <div class="block-head">
        <div class="block-title"><span class="status-dot dot-off" id="sd-gps"></span> GPS / GNSS</div>
        <span class="block-badge" id="bb-gps">—</span>
      </div>
      <div class="block-body" id="body-gps"><div class="err-msg">Загрузка...</div></div>
    </div>
    <div class="block" id="block-skyview">
      <div class="block-head">
        <div class="block-title">Карта неба</div>
        <span class="block-badge" id="bb-skyview">—</span>
      </div>
      <div class="block-body" id="body-skyview" style="display:flex;flex-direction:column;align-items:center;padding:12px">
        <div class="err-msg">Загрузка...</div>
      </div>
    </div>
  </div>

  <!-- Tracking + Clients + Server -->
  <div class="grid-3" style="margin-bottom:16px">
    <div class="block">
      <div class="block-head">
        <div class="block-title">Синхронизация</div>
      </div>
      <div class="block-body" id="body-tracking"><div class="err-msg">Загрузка...</div></div>
    </div>
    <div class="block">
      <div class="block-head">
        <div class="block-title">Клиенты</div>
        <span class="block-badge" id="bb-clients">—</span>
      </div>
      <div class="block-body scroll" id="body-clients"><div class="err-msg">Загрузка...</div></div>
    </div>
    <div class="block">
      <div class="block-head">
        <div class="block-title">Система</div>
      </div>
      <div class="block-body" id="body-system"><div class="err-msg">Загрузка...</div></div>
    </div>
  </div>

  <!-- Sourcestats -->
  <div class="block" style="margin-bottom:16px">
    <div class="block-head">
      <div class="block-title">Статистика источников (sourcestats)</div>
    </div>
    <div class="block-body scroll" id="body-sourcestats"><div class="err-msg">Загрузка...</div></div>
  </div>

</div><!-- /.wrap -->

<script>
const API = 'api.php';
let refreshTimer = null;

// ─── Helpers ───────────────────────────────────────────────

const $ = id => document.getElementById(id);

function h(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function statusClass(s) {
  return {good:'good', warning:'warn', error:'error'}[s] ?? '';
}

function dotClass(ok) {
  return ok ? 'dot-good' : 'dot-error';
}

// Convert octal reach string to 8-bit array
function reachBits(octalStr) {
  const dec = parseInt(octalStr, 8) || 0;
  const bits = [];
  for (let i = 7; i >= 0; i--) bits.push((dec >> i) & 1);
  return bits;
}

function reachBar(octalStr) {
  const bits = reachBits(octalStr);
  return '<div class="reach-bar">' +
    bits.map(b => `<div class="reach-bit ${b?'on':''}"></div>`).join('') +
  '</div>';
}

function srcStateEl(mode, state, isNoselect) {
  let cls, label;
  if (state === '*') { cls = 'src-selected'; label = '*'; }
  else if (state === '+') { cls = 'src-combined'; label = '+'; }
  else if (state === 'x' || state === '?') {
    cls = isNoselect ? 'src-noselect' : 'src-error';
    label = state;
  }
  else { cls = 'src-other'; label = state; }
  return `<span class="src-state ${cls}">${label}</span>`;
}

// ─── Render functions ──────────────────────────────────────

function renderCards(d) {
  const tr = d.tracking || {};
  const act = d.activity || {};
  const gps = d.gpsd || {};
  const sky = gps.sky || {};

  function fmtOffset(key) {
    const f = tr[key + '_fmt'];
    if (!f) return {v:'—', u:''};
    return {v: f.value, u: f.unit};
  }

  const sysOff = fmtOffset('system_time');
  const rmsOff = fmtOffset('rms_offset');

  const sysVal = Math.abs(parseFloat(tr.system_time || 0));
  const sysCls = sysVal > 0.5 ? 'error' : sysVal > 0.1 ? 'warn' : 'good';

  const cards = [
    { label: 'Stratum', value: tr.stratum ?? '—', unit: '', sub: tr.reference_id ?? '', cls: tr.stratum == 1 ? 'good' : '' },
    { label: 'Смещение системы', value: sysOff.v, unit: sysOff.u, sub: 'от NTP времени', cls: sysCls },
    { label: 'RMS смещение',     value: rmsOff.v, unit: rmsOff.u, sub: 'скользящее среднее', cls: '' },
    { label: 'Частота',          value: parseFloat(tr.frequency||0).toFixed(3), unit: 'ppm', sub: 'дрейф генератора', cls: '' },
    { label: 'Спутники',         value: (sky.used ?? '—') + (sky.total ? '/' + sky.total : ''), unit: '', sub: 'использ./видимых', cls: sky.used > 4 ? 'good' : sky.used > 0 ? 'warn' : '' },
    { label: 'Leap статус',      value: tr.leap_status ?? '—', unit: '', sub: '', cls: tr.leap_status === 'Normal' ? 'good' : 'warn' },
    { label: 'Онлайн источников',value: act.online ?? '—', unit: '', sub: `оффлайн: ${act.offline ?? '—'}`, cls: (act.online > 0) ? 'good' : 'error' },
  ];

  $('cards-row').innerHTML = cards.map(c => `
    <div class="metric-card ${c.cls}">
      <div class="metric-label">${h(c.label)}</div>
      <div class="metric-value">${h(c.value)}<span class="unit">${h(c.unit)}</span></div>
      ${c.sub ? `<div class="metric-sub">${h(c.sub)}</div>` : ''}
    </div>
  `).join('');
}

function renderSources(d) {
  const src = d.sources || {};
  const list = src.list || [];
  const sc = statusClass(src.status);

  const dot = $('sd-sources');
  dot.className = 'status-dot ' + (sc === 'good' ? 'dot-good' : sc === 'warn' ? 'dot-warn' : 'dot-error');

  const bb = $('bb-sources');
  bb.textContent = src.status === 'good' ? 'OK' : src.status === 'warning' ? 'WARN' : 'ERR';
  bb.className = 'block-badge ' + sc;

  if (!list.length) { $('body-sources').innerHTML = '<div class="err-msg">Нет источников</div>'; return; }

  $('body-sources').innerHTML = `
    <table class="sources-table">
      <thead><tr>
        <th></th><th>Источник</th><th>Str</th><th>Poll</th><th>Reach</th><th>LastRx</th><th>Смещение</th>
      </tr></thead>
      <tbody>
        ${list.map(s => `
          <tr>
            <td>${srcStateEl(s.mode, s.state, s.is_noselect)}</td>
            <td style="color:var(--text);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${h(s.name)}">${h(s.name)}</td>
            <td>${s.stratum || '—'}</td>
            <td>${s.poll}</td>
            <td>${reachBar(s.reach)}</td>
            <td>${h(s.last_rx)}</td>
            <td style="color:${s.state==='*'?'var(--green)':'var(--text2)'}">${h(s.offset)}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

function renderGps(d) {
  const gps = d.gpsd || {};
  const bb  = $('bb-gps');
  const dot = $('sd-gps');

  if (!gps.available) {
    dot.className = 'status-dot dot-off';
    bb.textContent = 'N/A';
    bb.className = 'block-badge';
    $('body-gps').innerHTML = '<div class="err-msg">gpsd недоступен</div>';
    renderSkyview([]);
    return;
  }

  const fix = gps.fix || {};
  const sky = gps.sky || {};
  const mode = fix.mode || 0;

  dot.className = 'status-dot ' + (mode === 3 ? 'dot-good' : mode === 2 ? 'dot-warn' : 'dot-error');
  bb.textContent = fix.mode_label || '—';
  bb.className = 'block-badge ' + (mode === 3 ? 'good' : mode === 2 ? 'warn' : 'error');

  const sats = sky.satellites || [];
  const usedCount = sats.filter(s => s.used).length;

  $('body-gps').innerHTML = `
    <div class="kv-list">
      <div class="kv-row"><span class="kv-key">Фикс</span><span class="kv-val ${mode===3?'good':mode===2?'warn':'error'}">${h(fix.mode_label)}</span></div>
      ${fix.lat != null ? `<div class="kv-row"><span class="kv-key">Широта</span><span class="kv-val accent">${fix.lat}°</span></div>` : ''}
      ${fix.lon != null ? `<div class="kv-row"><span class="kv-key">Долгота</span><span class="kv-val accent">${fix.lon}°</span></div>` : ''}
      ${fix.alt != null ? `<div class="kv-row"><span class="kv-key">Высота</span><span class="kv-val">${fix.alt} м</span></div>` : ''}
      <div class="kv-row"><span class="kv-key">PPS</span><span class="kv-val ${gps.pps?'good':'error'}">${gps.pps?'/dev/pps0 ✓':'Отсутствует'}</span></div>
      ${sky.hdop != null ? `<div class="kv-row"><span class="kv-key">HDOP</span><span class="kv-val">${sky.hdop}</span></div>` : ''}
      ${sky.vdop != null ? `<div class="kv-row"><span class="kv-key">VDOP</span><span class="kv-val">${sky.vdop}</span></div>` : ''}
      ${sky.pdop != null ? `<div class="kv-row"><span class="kv-key">PDOP</span><span class="kv-val">${sky.pdop}</span></div>` : ''}
      <div class="kv-row"><span class="kv-key">Спутников</span><span class="kv-val">${usedCount} / ${sats.length}</span></div>
    </div>
  `;

  renderSkyview(sats);
}

// ─── Skyview SVG ───────────────────────────────────────────

function renderSkyview(sats) {
  const bb = $('bb-skyview');

  const SZ   = 280;   // размер SVG
  const CX   = SZ / 2;
  const CY   = SZ / 2;
  const R    = SZ * 0.5 * 0.92; // радиус горизонта

  // Цвета в стилистике проекта
  const COL = {
    bg:       '#0f141c',
    ring:     '#1e2a3a',
    grid:     '#1e2a3a',
    gridText: '#4a6a88',
    compass:  '#7a9ab8',
    snrHigh:  '#39d98a',  // ≥40 dBHz — зелёный
    snrMid:   '#f5c842',  // 30-39   — жёлтый
    snrLow:   '#ff4d6a',  // <30     — красный
    unused:   '#243347',  // не используется (контур)
    label:    '#c8d8e8',
  };

  // Перевод азимут+элевация → XY на SVG
  function azel2xy(az, el) {
    // az: 0=N, 90=E, 180=S, 270=W
    // el: 0=горизонт, 90=зенит
    const r = R * (1 - el / 90);
    const angle = (az - 90) * Math.PI / 180; // 0° = вправо в тригонометрии
    const x = CX + r * Math.cos(angle);
    const y = CY + r * Math.sin(angle);
    return [x, y];
  }

  // Цвет по SNR
  function snrColor(snr, used) {
    if (!used) return null; // контур без заливки
    if (snr >= 40) return COL.snrHigh;
    if (snr >= 30) return COL.snrMid;
    return COL.snrLow;
  }

  // Форма по типу GNSS (gnssid или PRN-диапазон)
  // gnssid: 0=GPS, 1=SBAS, 2=Galileo, 3=BeiDou, 5=QZSS, 6=GLONASS
  function satShape(sat) {
    const gid = sat.gnss;
    const prn = sat.prn;
    if (gid === 6) return 'square';    // GLONASS
    if (gid === 3) return 'tri-down';  // BeiDou
    if (gid === 2) return 'tri-up';    // Galileo
    if (gid === 1) return 'diamond';   // SBAS/WAAS
    if (gid === 5) return 'circle';    // QZSS
    // Fallback по PRN диапазону
    if (prn >= 65 && prn <= 96)  return 'square';   // GLONASS
    if (prn >= 300 && prn <= 400) return 'tri-down'; // BeiDou
    if (prn >= 400)               return 'tri-down'; // BeiDou alt
    return 'circle'; // GPS по умолчанию
  }

  // Построить SVG-фигуру спутника
  function satSVG(sat) {
    if (sat.el == null || sat.az == null) return '';
    const [x, y] = azel2xy(sat.az, sat.el);
    const snr    = sat.ss || 0;
    const used   = sat.used;
    const shape  = satShape(sat);
    const fill   = used ? (snrColor(snr, true) || COL.snrLow) : 'none';
    const stroke = used ? fill : COL.unused;
    const sw     = used ? 0 : 1.5;
    const S      = 7; // half-size
    const label  = sat.prn;

    let shapeEl = '';
    if (shape === 'circle') {
      shapeEl = `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${S}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`;
    } else if (shape === 'square') {
      shapeEl = `<rect x="${(x-S).toFixed(1)}" y="${(y-S).toFixed(1)}" width="${S*2}" height="${S*2}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`;
    } else if (shape === 'tri-up') {
      const pts = `${x.toFixed(1)},${(y-S).toFixed(1)} ${(x-S).toFixed(1)},${(y+S).toFixed(1)} ${(x+S).toFixed(1)},${(y+S).toFixed(1)}`;
      shapeEl = `<polygon points="${pts}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`;
    } else if (shape === 'tri-down') {
      const pts = `${x.toFixed(1)},${(y+S).toFixed(1)} ${(x-S).toFixed(1)},${(y-S).toFixed(1)} ${(x+S).toFixed(1)},${(y-S).toFixed(1)}`;
      shapeEl = `<polygon points="${pts}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`;
    } else if (shape === 'diamond') {
      const pts = `${x.toFixed(1)},${(y-S).toFixed(1)} ${(x+S).toFixed(1)},${y.toFixed(1)} ${x.toFixed(1)},${(y+S).toFixed(1)} ${(x-S).toFixed(1)},${y.toFixed(1)}`;
      shapeEl = `<polygon points="${pts}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`;
    }

    // Подпись PRN
    const labelEl = `<text x="${(x+S+2).toFixed(1)}" y="${(y+4).toFixed(1)}" font-family="JetBrains Mono,monospace" font-size="8" fill="${COL.gridText}">${label}</text>`;

    const title = `PRN:${sat.prn} El:${sat.el}° Az:${sat.az}° SNR:${snr}dBHz ${used?'[используется]':''}`;
    return `<g><title>${title}</title>${shapeEl}${labelEl}</g>`;
  }

  // Концентрические кольца (элевация)
  function rings() {
    let out = '';
    for (let el = 0; el <= 75; el += 15) {
      const r = R * (1 - el / 90);
      out += `<circle cx="${CX}" cy="${CY}" r="${r.toFixed(1)}" fill="none" stroke="${COL.ring}" stroke-width="0.5" stroke-dasharray="${el===0?'none':'3,4'}"/>`;
      if (el > 0) {
        out += `<text x="${(CX+4).toFixed(1)}" y="${(CY-r+10).toFixed(1)}" font-family="JetBrains Mono,monospace" font-size="8" fill="${COL.gridText}">${el}°</text>`;
      }
    }
    return out;
  }

  // Радиальные линии (азимут каждые 30°)
  function radials() {
    let out = '';
    for (let az = 0; az < 180; az += 30) {
      const [x0,y0] = azel2xy(az, 0);
      const [x1,y1] = azel2xy(az+180, 0);
      out += `<line x1="${x0.toFixed(1)}" y1="${y0.toFixed(1)}" x2="${x1.toFixed(1)}" y2="${y1.toFixed(1)}" stroke="${COL.grid}" stroke-width="0.5"/>`;
    }
    return out;
  }

  // Compass labels
  function compass() {
    const dirs = [{l:'N',az:0},{l:'E',az:90},{l:'S',az:180},{l:'W',az:270}];
    return dirs.map(d => {
      const [x,y] = azel2xy(d.az, 0);
      const ox = d.az===90?10:d.az===270?-10:0;
      const oy = d.az===180?12:d.az===0?-4:4;
      return `<text x="${(x+ox).toFixed(1)}" y="${(y+oy).toFixed(1)}" font-family="JetBrains Mono,monospace" font-size="10" font-weight="700" fill="${COL.compass}" text-anchor="middle">${d.l}</text>`;
    }).join('');
  }

  if (!sats.length) {
    $('body-skyview').innerHTML = '<div class="err-msg">Нет данных о спутниках</div>';
    bb.textContent = '0 спутников';
    bb.className = 'block-badge';
    return;
  }

  const usedCount = sats.filter(s => s.used).length;
  bb.textContent = `${usedCount}/${sats.length} спутников`;
  bb.className = 'block-badge ' + (usedCount > 4 ? 'good' : usedCount > 0 ? 'warn' : 'error');

  const satsSVG = sats.map(satSVG).join('');

  const svg = `
    <svg id="skyview-svg" viewBox="0 0 ${SZ} ${SZ}" width="${SZ}" height="${SZ}" xmlns="http://www.w3.org/2000/svg">
      <!-- Background -->
      <circle cx="${CX}" cy="${CY}" r="${R}" fill="${COL.bg}" stroke="${COL.ring}" stroke-width="1"/>
      <!-- Grid rings -->
      ${rings()}
      <!-- Radial lines -->
      ${radials()}
      <!-- Compass -->
      ${compass()}
      <!-- Satellites -->
      ${satsSVG}
    </svg>
  `;

  // Легенда
  const legend = `
    <div class="sky-legend">
      <div class="sky-legend-item">
        <svg class="sky-legend-shape" viewBox="0 0 14 14"><circle cx="7" cy="7" r="5" fill="#39d98a"/></svg>
        GPS/QZSS ≥40
      </div>
      <div class="sky-legend-item">
        <svg class="sky-legend-shape" viewBox="0 0 14 14"><circle cx="7" cy="7" r="5" fill="#f5c842"/></svg>
        30–39 dBHz
      </div>
      <div class="sky-legend-item">
        <svg class="sky-legend-shape" viewBox="0 0 14 14"><circle cx="7" cy="7" r="5" fill="#ff4d6a"/></svg>
        &lt;30 dBHz
      </div>
      <div class="sky-legend-item">
        <svg class="sky-legend-shape" viewBox="0 0 14 14"><rect x="2" y="2" width="10" height="10" fill="none" stroke="#243347" stroke-width="1.5"/></svg>
        GLONASS
      </div>
      <div class="sky-legend-item">
        <svg class="sky-legend-shape" viewBox="0 0 14 14"><polygon points="7,1 13,13 1,13" fill="none" stroke="#243347" stroke-width="1.5"/></svg>
        Galileo ▲
      </div>
      <div class="sky-legend-item">
        <svg class="sky-legend-shape" viewBox="0 0 14 14"><polygon points="7,13 13,1 1,1" fill="none" stroke="#243347" stroke-width="1.5"/></svg>
        BeiDou ▼
      </div>
      <div class="sky-legend-item">
        <svg class="sky-legend-shape" viewBox="0 0 14 14"><polygon points="7,1 13,7 7,13 1,7" fill="none" stroke="#243347" stroke-width="1.5"/></svg>
        SBAS ◇
      </div>
      <div class="sky-legend-item">
        <svg class="sky-legend-shape" viewBox="0 0 14 14"><circle cx="7" cy="7" r="5" fill="none" stroke="#243347" stroke-width="1.5"/></svg>
        Не исп.
      </div>
    </div>
  `;

  $('body-skyview').innerHTML = svg + legend;
}

function renderTracking(d) {
  const tr = d.tracking || {};

  function kv(label, valObj, extra) {
    if (!valObj) return '';
    const v = typeof valObj === 'object' && valObj.value !== undefined
      ? `${h(valObj.value)}<span style="color:var(--text3);font-size:.68rem;margin-left:3px">${h(valObj.unit)}</span>`
      : h(valObj);
    return `<div class="kv-row"><span class="kv-key">${label}</span><span class="kv-val ${extra||''}">${v}</span></div>`;
  }

  const sysVal = Math.abs(parseFloat(tr.system_time || 0));
  const sysCls = sysVal > 0.5 ? 'error' : sysVal > 0.1 ? 'warn' : 'good';

  $('body-tracking').innerHTML = `<div class="kv-list">
    ${kv('Reference ID', tr.reference_id, 'accent')}
    ${kv('Stratum', tr.stratum)}
    ${kv('Ref time (UTC)', tr.ref_time ? tr.ref_time.substring(0,19) : '—')}
    ${kv('Смещение', tr.system_time_fmt, sysCls)}
    ${kv('Last offset', tr.last_offset_fmt)}
    ${kv('RMS offset', tr.rms_offset_fmt)}
    ${kv('Частота', tr.frequency ? tr.frequency + ' ppm' : '—')}
    ${kv('Skew', tr.skew ? tr.skew + ' ppm' : '—')}
    ${kv('Root delay', tr.root_delay_fmt)}
    ${kv('Root dispersion', tr.root_dispersion_fmt)}
    ${kv('Интервал обновл.', tr.update_interval ? tr.update_interval + ' с' : '—')}
    ${kv('Leap status', tr.leap_status, tr.leap_status === 'Normal' ? 'good' : 'warn')}
  </div>`;
}

function renderClients(d) {
  const cl = d.clients || {};
  const list = (cl.list || []).filter(c => c.hostname !== 'localhost');
  const realCount = list.length;

  $('bb-clients').textContent = realCount + ' клиент' + (realCount === 1 ? '' : 'ов');
  $('bb-clients').className = 'block-badge ' + (realCount > 0 ? 'good' : '');

  if (!realCount) {
    $('body-clients').innerHTML = '<div class="err-msg">Нет активных клиентов</div>';
    return;
  }

  $('body-clients').innerHTML = `
    <table class="clients-table">
      <thead><tr><th>Хост</th><th>NTP</th><th>Drop</th><th>Last</th></tr></thead>
      <tbody>
        ${list.map(c => `
          <tr>
            <td style="color:var(--text);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${h(c.hostname)}">${h(c.hostname)}</td>
            <td>${c.ntp}</td>
            <td>${c.drop > 0 ? `<span style="color:var(--yellow)">${c.drop}</span>` : '0'}</td>
            <td>${h(c.last)}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

function renderSystem(d) {
  const sys = d.system || {};
  const ss  = d.serverstats || {};
  const mem = sys.memory || {};
  const load = sys.load || [0,0,0];
  const temp = sys.temp;
  const tempCls = temp > 75 ? 'error' : temp > 60 ? 'warn' : 'good';
  const memPct  = mem.percent || 0;
  const memCls  = memPct > 90 ? 'error' : memPct > 75 ? 'warn' : 'good';

  $('body-system').innerHTML = `
    <div class="kv-list">
      <div class="kv-row"><span class="kv-key">Uptime</span><span class="kv-val">${h(sys.uptime)}</span></div>
      ${temp != null ? `
        <div class="kv-row"><span class="kv-key">Температура</span><span class="kv-val ${tempCls}">${temp} °C</span></div>
        <div class="progress-wrap"><div class="progress-bar ${temp>75?'hot':temp>60?'warm':''}" style="width:${Math.min(temp,100)}%"></div></div>
      ` : ''}
      ${mem.percent != null ? `
        <div class="kv-row" style="margin-top:6px"><span class="kv-key">RAM</span><span class="kv-val ${memCls}">${memPct}%</span></div>
        <div class="progress-wrap"><div class="progress-bar ${memCls}" style="width:${memPct}%"></div></div>
      ` : ''}
      <div class="kv-row" style="margin-top:6px"><span class="kv-key">Load avg</span><span class="kv-val">${load.map(l=>l.toFixed(2)).join(' ')}</span></div>
      <div class="kv-row"><span class="kv-key">chrony</span><span class="kv-val ${sys.chrony_active?'good':'error'}">${sys.chrony_active?'active':'inactive'}</span></div>
      <div class="kv-row"><span class="kv-key">gpsd</span><span class="kv-val ${sys.gpsd_active?'good':'error'}">${sys.gpsd_active?'active':'inactive'}</span></div>
      <div class="kv-row"><span class="kv-key">/dev/pps0</span><span class="kv-val ${sys.pps_device?'good':'error'}">${sys.pps_device?'present':'missing'}</span></div>
      <div class="kv-row"><span class="kv-key">/dev/ttyAMA0</span><span class="kv-val ${sys.uart_device?'good':'error'}">${sys.uart_device?'present':'missing'}</span></div>
      ${ss.packets_received != null ? `<div class="kv-row"><span class="kv-key">NTP пакетов</span><span class="kv-val">${ss.packets_received}</span></div>` : ''}
      ${ss.packets_dropped  != null && ss.packets_dropped > 0 ? `<div class="kv-row"><span class="kv-key">Отброшено</span><span class="kv-val warn">${ss.packets_dropped}</span></div>` : ''}
    </div>
  `;
}

function renderSourcestats(d) {
  const ss = d.sourcestats || {};
  const list = ss.list || [];

  if (!list.length) { $('body-sourcestats').innerHTML = '<div class="err-msg">Нет данных</div>'; return; }

  $('body-sourcestats').innerHTML = `
    <table class="sources-table">
      <thead><tr>
        <th>Источник</th><th>NP</th><th>NR</th><th>Span</th><th>Freq (ppm)</th><th>Freq skew</th><th>Offset</th><th>Std Dev</th>
      </tr></thead>
      <tbody>
        ${list.map(s => `<tr>
          <td style="color:var(--text)">${h(s.name)}</td>
          <td>${h(s.np)}</td><td>${h(s.nr)}</td><td>${h(s.span)}</td>
          <td>${h(s.frequency)}</td><td>${h(s.freq_skew)}</td>
          <td>${h(s.offset)}</td><td>${h(s.std_dev)}</td>
        </tr>`).join('')}
      </tbody>
    </table>
  `;
}

function renderHeader(d) {
  const sys = d.system || {};
  $('h-hostname').textContent = sys.hostname || '—';
  $('h-time').textContent = new Date().toLocaleTimeString('ru-RU');

  const svc = [
    { label: 'chrony', on: sys.chrony_active },
    { label: 'gpsd',   on: sys.gpsd_active },
    { label: 'PPS',    on: sys.pps_device },
  ];
  $('h-services').innerHTML = svc.map(s =>
    `<div class="svc-pill ${s.on?'on':'off'}"><span class="status-dot" style="width:6px;height:6px;${s.on?'background:var(--green)':'background:var(--red)'}"></span>${s.label}</div>`
  ).join('');
}

// ─── Main render ───────────────────────────────────────────

function render(d) {
  renderHeader(d);
  renderCards(d);
  renderSources(d);
  renderGps(d);
  renderTracking(d);
  renderClients(d);
  renderSystem(d);
  renderSourcestats(d);
}

// ─── Fetch ─────────────────────────────────────────────────

async function refresh() {
  try {
    const r = await fetch(API + '?_=' + Date.now());
    const d = await r.json();
    render(d);

    // Hide loader on first load
    const loader = $('loader');
    if (loader.style.display !== 'none') {
      loader.style.opacity = '0';
      setTimeout(() => { loader.style.display = 'none'; }, 400);
      $('app').style.opacity = '1';
    }
  } catch(e) {
    console.error('API error:', e);
    $('h-time').textContent = 'Ошибка';
  }
}

// Auto-refresh every 15 seconds
function startTimer() {
  clearInterval(refreshTimer);
  refreshTimer = setInterval(refresh, 15000);
}

refresh().then(startTimer);
</script>
