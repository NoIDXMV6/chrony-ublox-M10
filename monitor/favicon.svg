<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e14"/>
      <stop offset="100%" stop-color="#151c27"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#0099cc"/>
    </linearGradient>
  </defs>

  <!-- Фон -->
  <circle cx="50" cy="50" r="48" fill="url(#bg)" stroke="url(#accent)" stroke-width="2.5"/>

  <!-- Циферблат (метки) -->
  <g stroke="url(#accent)" stroke-width="2" stroke-linecap="round">
    <line x1="50" y1="12" x2="50" y2="18"/>
    <line x1="50" y1="82" x2="50" y2="88"/>
    <line x1="12" y1="50" x2="18" y2="50"/>
    <line x1="82" y1="50" x2="88" y2="50"/>
    <!-- Дополнительные метки -->
    <line x1="25" y1="18" x2="28" y2="22" transform="rotate(30 50 50)"/>
    <line x1="25" y1="18" x2="28" y2="22" transform="rotate(60 50 50)"/>
    <line x1="25" y1="18" x2="28" y2="22" transform="rotate(120 50 50)"/>
    <line x1="25" y1="18" x2="28" y2="22" transform="rotate(150 50 50)"/>
    <line x1="25" y1="18" x2="28" y2="22" transform="rotate(210 50 50)"/>
    <line x1="25" y1="18" x2="28" y2="22" transform="rotate(240 50 50)"/>
    <line x1="25" y1="18" x2="28" y2="22" transform="rotate(300 50 50)"/>
    <line x1="25" y1="18" x2="28" y2="22" transform="rotate(330 50 50)"/>
  </g>

  <!-- Стрелки (время 10:10) -->
  <!-- Часовая стрелка -->
  <line x1="50" y1="50" x2="38" y2="30" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
  <!-- Минутная стрелка -->
  <line x1="50" y1="50" x2="60" y2="22" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Центральная точка -->
  <circle cx="50" cy="50" r="3" fill="url(#accent)"/>

  <!-- Текст NTP -->
  <text x="50" y="72" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold" fill="url(#accent)" text-anchor="middle" letter-spacing="2">NTP</text>
</svg>